# Firmware configuration file for x86_64 UEFI
#
# Phase 2: A/B via the cold-boot chooser + kexec validate-before-commit.
#
#   * GPT partition table (UEFI-spec ESP discovery).
#   * FAT EFI System Partition holding:
#       /EFI/BOOT/BOOTX64.EFI       the uefi_ab_chooser (firmware fallback path)
#       /EFI/nerves/vmlinuz-a.efi   slot A kernel (bare EFI-stub bzImage)
#       /EFI/nerves/vmlinuz-b.efi   slot B kernel
#       /EFI/nerves/bootstate       tiny text file: which slot to cold-boot
#   * No GRUB. The chooser reads `bootstate`, loads vmlinuz-<active>.efi and
#     supplies root=PARTUUID=<slot> via EFI LoadOptions (per-slot cmdline, so
#     the kernels are bare/unbaked).
#
# Commit model: the kernel cmdline and the cold-boot slot are NOT baked into the
# kernel. `complete` provisions slot A and seeds bootstate=a. `upgrade.a`/
# `upgrade.b` write the INACTIVE slot's rootfs + kernel but DO NOT flip
# nerves_fw_active or bootstate. The Elixir update-agent (oshlabs/nerves_uefi_ab)
# kexecs into the new slot, health-checks, and only then commits by flipping
# bootstate (chooser) and nerves_fw_active (runtime KV). A failed trial just hits
# the watchdog and cold-boots the still-committed slot. See PLAN.md.

require-fwup-version="1.0.0"

#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "x86_64_uefi")
define(NERVES_FW_ARCHITECTURE, "x86_64")
define(NERVES_FW_AUTHOR, "oshlabs")

# /dev/rootdisk* paths are provided by erlinit to refer to the disk and partitions
# on whatever drive provides the rootfs.
define(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p4") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Fixed GUIDs so PARTUUIDs are deterministic (reproducible builds) and can be
# referenced from the chooser's per-slot command lines (root=PARTUUID=...).
define(DISK_GUID,        "b443fbef-b2c1-4dd9-8f4b-000000000000")
define(ESP_PARTUUID,     "b443fbef-b2c1-4dd9-8f4b-000000000001")
define(ROOTFS_A_PARTUUID,"b443fbef-b2c1-4dd9-8f4b-00000000000a")
define(ROOTFS_B_PARTUUID,"b443fbef-b2c1-4dd9-8f4b-00000000000b")
define(APP_PARTUUID,     "b443fbef-b2c1-4dd9-8f4b-000000000004")

# GPT type GUIDs
define(ESP_TYPE,    "c12a7328-f81f-11d2-ba4b-00a0c93ec93b") # EFI System Partition
define(LINUX_TYPE,  "0fc63daf-8483-4772-8e79-3d69d8477de4") # Linux filesystem

# This configuration file will create a GPT image with the following layout:
#
# +----------------------------+
# | Protective MBR + GPT       |
# +----------------------------+
# | Firmware configuration data|
# | (formatted as uboot env)   |
# +----------------------------+
# | p1: EFI System Partition   |
# |     (FAT32)                |
# |     /EFI/BOOT/BOOTX64.EFI  |  (chooser)
# |     /EFI/nerves/vmlinuz-a  |
# |     /EFI/nerves/vmlinuz-b  |
# |     /EFI/nerves/bootstate  |
# +----------------------------+
# | p2: Rootfs A (squashfs)    |
# +----------------------------+
# | p3: Rootfs B (squashfs)    |
# +----------------------------+
# | p4: Application (ext4)     |
# +----------------------------+
# | GPT backup                 |
# +----------------------------+

define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

# The EFI System Partition holds the chooser + both per-slot kernels + bootstate.
# 100 MiB per the Arch wiki ESP minimum and to leave headroom.
define(BOOT_PART_OFFSET, 4096)
define(BOOT_PART_COUNT, 204800)  # 100 MiB

# Let the rootfs have room to grow up to 256 MiB
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 524288)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application data partition (256 MiB). This can be enlarged
# to fill the entire volume.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 524288)
define-eval(APP_PART_LAST_OFFSET, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 1")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

# File resources are listed in the order that they are included in the .fw file.
#
# The chooser (chooser.efi) is the uefi_ab_chooser, installed to the images dir
# by its Buildroot package. The kernel (bzImage) is a valid PE/COFF EFI app
# (CONFIG_EFI_STUB=y); it is written per-slot as vmlinuz-{a,b}.efi. bootstate is
# the tiny seed file written by post-build.sh.
file-resource chooser.efi {
    host-path = "${NERVES_SYSTEM}/images/chooser.efi"
}
file-resource kernel.efi {
    host-path = "${NERVES_SYSTEM}/images/bzImage"
}
file-resource bootstate {
    host-path = "${NERVES_SYSTEM}/images/bootstate"
}
# Trial-start bootstates written by the A/B upgrade tasks: writing one tells the
# chooser to boot that (just-written) slot on its next cold boot, on trial. The
# Elixir agent promotes try->active once the firmware validates. See PLAN.md.
file-resource bootstate_try_a {
    host-path = "${NERVES_SYSTEM}/images/bootstate-try-a"
}
file-resource bootstate_try_b {
    host-path = "${NERVES_SYSTEM}/images/bootstate-try-b"
}
file-resource rootfs.img {
    host-path = ${ROOTFS}

    # Error out if the rootfs size exceeds the partition size
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

gpt gpt {
    guid = ${DISK_GUID}

    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = ${ESP_TYPE}
        guid = ${ESP_PARTUUID}
        name = "EFI-SYSTEM"
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_TYPE}
        guid = ${ROOTFS_A_PARTUUID}
        name = "rootfs.a"
    }
    partition 2 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_TYPE}
        guid = ${ROOTFS_B_PARTUUID}
        name = "rootfs.b"
    }
    partition 3 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_TYPE}
        guid = ${APP_PARTUUID}
        name = "app"
        expand = true
    }
}

# Location where installed firmware information is stored.
# While this is called "u-boot", u-boot isn't involved in this
# setup. It just provides a convenient key/value store format.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# This firmware task writes everything to the destination media.
# This should only be run for the first installation. It provisions slot A and
# seeds bootstate=a; slot B is left invalid until the first upgrade writes it.
task complete {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt)

        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_mkdir(${BOOT_PART_OFFSET}, "/EFI")
        fat_mkdir(${BOOT_PART_OFFSET}, "/EFI/BOOT")
        fat_mkdir(${BOOT_PART_OFFSET}, "/EFI/nerves")

        uboot_clearenv(uboot-env)

        include("${NERVES_PROVISIONING}")

        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }

    # The chooser is the firmware fallback path. It is written at install time
    # only and is NOT part of OTA updates (single point of cold-boot failure).
    on-resource chooser.efi { fat_write(${BOOT_PART_OFFSET}, "/EFI/BOOT/BOOTX64.EFI") }

    # Same kernel image into both slot files so the chooser's fallback-to-other-
    # slot path is bootable from the start. (Slot B's rootfs is still invalid
    # until the first upgrade; bootstate=a means B is never selected yet.)
    # fat_write streams the resource once, so duplicate within the FAT via fat_cp.
    on-resource kernel.efi {
        fat_write(${BOOT_PART_OFFSET}, "/EFI/nerves/vmlinuz-a.efi")
        fat_cp(${BOOT_PART_OFFSET}, "/EFI/nerves/vmlinuz-a.efi", "/EFI/nerves/vmlinuz-b.efi")
    }

    on-resource bootstate { fat_write(${BOOT_PART_OFFSET}, "/EFI/nerves/bootstate") }

    on-resource rootfs.img {
        # write to the first rootfs partition
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
      # Clear out any old data in the B partition that might be mistaken for
      # a file system.
      raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)

      # Invalidate the application data partition so that it is guaranteed to
      # trigger the corrupt filesystem detection code on first boot and get
      # formatted.
      raw_memset(${APP_PART_OFFSET}, 256, 0xff)

      # If writing to a file, make sure that the image is long enough. This is
      # needed for qemu.
      raw_memset(${APP_PART_LAST_OFFSET}, 1, 0xff)
    }
}

# A/B upgrade: write the INACTIVE slot only. These tasks deliberately do NOT
# flip nerves_fw_active or bootstate - the Elixir update-agent commits after a
# kexec validation (see PLAN.md). `fwup -t upgrade` auto-selects the task whose
# require-uboot-variable matches: running A (active=a) -> upgrade.b writes B;
# running B (active=b) -> upgrade.a writes A.

# Running B, upgrade the inactive A slot.
task upgrade.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading inactive slot A (running B); starts a trial of A on next boot")
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }

    on-resource kernel.efi { fat_write(${BOOT_PART_OFFSET}, "/EFI/nerves/vmlinuz-a.efi") }

    on-resource rootfs.img {
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    # Start a trial of A: chooser boots A next, counting attempts. nerves_fw_active
    # is NOT flipped here - the agent promotes try->active only after validation.
    on-resource bootstate_try_a { fat_write(${BOOT_PART_OFFSET}, "/EFI/nerves/bootstate") }

    on-finish {
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }
}

# Running A, upgrade the inactive B slot.
task upgrade.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading inactive slot B (running A); starts a trial of B on next boot")
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }

    on-resource kernel.efi { fat_write(${BOOT_PART_OFFSET}, "/EFI/nerves/vmlinuz-b.efi") }

    on-resource rootfs.img {
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    # Start a trial of B: chooser boots B next, counting attempts. nerves_fw_active
    # is NOT flipped here - the agent promotes try->active only after validation.
    on-resource bootstate_try_b { fat_write(${BOOT_PART_OFFSET}, "/EFI/nerves/bootstate") }

    on-finish {
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

task provision {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        include("${NERVES_PROVISIONING}")
    }
}
task provision.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}
